<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiniela Mundial 2026</title>
<style>
:root {
  --bg: #0a0e1a;
  --card: #141828;
  --card-hover: #1c2240;
  --accent: #8b5cf6;
  --accent2: #06b6d4;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --border: #1e293b;
  --gold: #fbbf24;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ===== PASSWORD SCREEN ===== */
.lock-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #1a1040 0%, #0a0e1a 50%, #0a1628 100%);
  position: relative;
  overflow: hidden;
}

.lock-screen::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 50%, rgba(139,92,246,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 50%, rgba(6,182,212,0.06) 0%, transparent 50%);
  animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.lock-icon {
  font-size: 4rem;
  margin-bottom: 20px;
  position: relative;
}

.lock-title {
  font-size: 2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold), #f97316, var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  position: relative;
  text-align: center;
}

.lock-subtitle {
  color: var(--text-dim);
  font-size: 0.95rem;
  margin-bottom: 30px;
  position: relative;
  text-align: center;
}

.lock-form {
  display: flex;
  gap: 10px;
  position: relative;
  flex-wrap: wrap;
  justify-content: center;
}

.lock-form input {
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  width: 240px;
  outline: none;
  transition: border-color 0.2s;
}

.lock-form input:focus { border-color: var(--accent); }

.lock-form button {
  padding: 14px 28px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
}

.lock-form button:hover { background: #7c3aed; }

.lock-error {
  color: var(--red);
  font-size: 0.85rem;
  margin-top: 12px;
  position: relative;
  display: none;
}

.lock-info {
  margin-top: 30px;
  padding: 16px 24px;
  background: rgba(139,92,246,0.1);
  border: 1px solid rgba(139,92,246,0.2);
  border-radius: 12px;
  position: relative;
  text-align: center;
}

.lock-info .price {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--gold);
}

.lock-info .price-label {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ===== MAIN APP ===== */
.app { display: none; }
.app.active { display: block; }

.hero {
  background: linear-gradient(135deg, #1a1040 0%, #0a0e1a 50%, #0a1628 100%);
  padding: 24px 16px 18px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle at 30% 50%, rgba(139,92,246,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 50%, rgba(6,182,212,0.06) 0%, transparent 50%);
  animation: pulse 8s ease-in-out infinite;
}

.hero h1 {
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold), #f97316, var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
}

.hero .subtitle {
  color: var(--text-dim);
  font-size: 0.85rem;
  position: relative;
}

.hero .deadline {
  color: var(--red);
  font-size: 0.8rem;
  font-weight: 600;
  position: relative;
  margin-top: 4px;
}

/* ===== TABS ===== */
.nav-tabs {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 14, 26, 0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
}

.nav-tab {
  flex: 1;
  padding: 12px 8px;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  color: var(--text-dim);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
.nav-tab .tab-icon { display: block; font-size: 1.2rem; margin-bottom: 2px; }

.main { max-width: 900px; margin: 0 auto; padding: 16px; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ===== QUINIELA FORM ===== */
.form-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  text-align: center;
}

.form-header h3 {
  color: var(--accent2);
  font-size: 1rem;
  margin-bottom: 10px;
}

.name-input {
  padding: 12px 18px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  width: 100%;
  max-width: 350px;
  outline: none;
}

.name-input:focus { border-color: var(--accent); }

.jornada-section {
  margin-bottom: 24px;
}

.jornada-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent2);
  margin-bottom: 12px;
  padding: 8px 14px;
  background: rgba(6,182,212,0.08);
  border-radius: 10px;
  border-left: 3px solid var(--accent2);
}

.match-row {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  transition: all 0.15s;
}

.match-row.selected {
  border-color: var(--green);
  background: rgba(16,185,129,0.05);
}

.match-teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  gap: 8px;
}

.match-team {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  flex: 1;
  min-width: 0;
}

.match-team span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.match-team.away { justify-content: flex-end; flex-direction: row-reverse; }

.team-flag {
  width: 24px;
  height: 16px;
  border-radius: 2px;
  object-fit: cover;
  flex-shrink: 0;
}

.match-info {
  text-align: center;
  flex-shrink: 0;
  min-width: 70px;
}

.match-info .date { font-size: 0.65rem; color: var(--text-dim); }
.match-info .time { font-size: 0.85rem; font-weight: 700; color: var(--accent2); }

.prediction-btns {
  display: flex;
  gap: 6px;
}

.pred-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.pred-btn:hover { border-color: var(--accent); color: var(--text); }

.pred-btn.selected-home {
  background: rgba(16,185,129,0.2);
  border-color: var(--green);
  color: var(--green);
}

.pred-btn.selected-draw {
  background: rgba(245,158,11,0.2);
  border-color: var(--amber);
  color: var(--amber);
}

.pred-btn.selected-away {
  background: rgba(139,92,246,0.2);
  border-color: var(--accent);
  color: var(--accent);
}

.submit-section {
  text-align: center;
  padding: 20px;
  margin-top: 10px;
}

.submit-btn {
  padding: 16px 48px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--green), #059669);
  color: #fff;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 15px rgba(16,185,129,0.3);
}

.submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.progress-bar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  text-align: center;
}

.progress-fill-wrap {
  background: var(--bg);
  border-radius: 8px;
  height: 8px;
  margin-top: 8px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--green));
  border-radius: 8px;
  transition: width 0.3s;
  width: 0%;
}

.progress-text {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.progress-text strong { color: var(--accent2); }

/* ===== PARTICIPANTS ===== */
.participants-header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  text-align: center;
}

.participants-count {
  font-size: 2.5rem;
  font-weight: 800;
  color: var(--accent2);
}

.participants-label {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.participant-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}

.participant-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
  transition: background 0.15s;
}

.participant-header:hover { background: var(--card-hover); }

.participant-name {
  font-weight: 700;
  font-size: 0.95rem;
}

.participant-date {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.participant-points {
  background: rgba(6,182,212,0.15);
  color: var(--accent2);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 700;
}

.participant-toggle {
  color: var(--text-dim);
  font-size: 0.8rem;
  transition: transform 0.3s;
}

.participant-preds {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid var(--border);
}

.participant-preds.open { display: block; }

.pred-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 0.8rem;
  border-bottom: 1px solid rgba(30,41,59,0.5);
}

.pred-row:last-child { border-bottom: none; }

.pred-match { color: var(--text-dim); flex: 1; }

.pred-value {
  padding: 2px 10px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 0.75rem;
}

.pred-value.home { background: rgba(16,185,129,0.15); color: var(--green); }
.pred-value.draw { background: rgba(245,158,11,0.15); color: var(--amber); }
.pred-value.away { background: rgba(139,92,246,0.15); color: var(--accent); }
.pred-value.correct { background: rgba(16,185,129,0.3); color: #34d399; }
.pred-value.wrong { background: rgba(239,68,68,0.15); color: var(--red); }

/* ===== ADMIN ===== */
.admin-login {
  text-align: center;
  padding: 40px 20px;
}

.admin-login input {
  padding: 12px 18px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  width: 100%;
  max-width: 300px;
  margin-bottom: 12px;
  outline: none;
}

.admin-login button {
  padding: 12px 28px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.admin-panel { display: none; }
.admin-panel.active { display: block; }

.admin-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
}

.admin-section h3 {
  color: var(--accent2);
  font-size: 1rem;
  margin-bottom: 14px;
}

.result-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(30,41,59,0.5);
  flex-wrap: wrap;
}

.result-row:last-child { border-bottom: none; }

.result-teams {
  flex: 1;
  font-size: 0.8rem;
  min-width: 150px;
}

.result-btns {
  display: flex;
  gap: 4px;
}

.result-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.result-btn.active-home { background: rgba(16,185,129,0.2); border-color: var(--green); color: var(--green); }
.result-btn.active-draw { background: rgba(245,158,11,0.2); border-color: var(--amber); color: var(--amber); }
.result-btn.active-away { background: rgba(139,92,246,0.2); border-color: var(--accent); color: var(--accent); }

.admin-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.admin-btn {
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}

.btn-save { background: var(--green); }
.btn-pdf { background: var(--accent); }
.btn-export { background: var(--amber); color: #000; }

/* ===== LEADERBOARD ===== */
.leaderboard {
  margin-top: 20px;
}

.leaderboard-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 6px;
}

.leaderboard-pos {
  font-size: 1.2rem;
  font-weight: 800;
  min-width: 30px;
  text-align: center;
}

.leaderboard-pos.gold { color: var(--gold); }
.leaderboard-pos.silver { color: #c0c0c0; }
.leaderboard-pos.bronze { color: #cd7f32; }

.leaderboard-name { flex: 1; font-weight: 600; }

.leaderboard-pts {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--accent2);
}

/* ===== CLOSED BANNER ===== */
.closed-banner {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.closed-banner h3 { color: var(--red); margin-bottom: 6px; }
.closed-banner p { color: var(--text-dim); font-size: 0.9rem; }

/* ===== ALREADY SUBMITTED ===== */
.already-submitted {
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.already-submitted h3 { color: var(--green); margin-bottom: 6px; }

/* ===== STATUS MSG ===== */
.status-msg {
  padding: 14px;
  border-radius: 10px;
  margin: 12px 0;
  font-size: 0.9rem;
  display: none;
}

.status-msg.success { display: block; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--green); }
.status-msg.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 24px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  z-index: 999;
  transition: transform 0.3s;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== SETUP BANNER ===== */
.setup-banner {
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--amber);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .main { padding: 12px; }
  .hero { padding: 20px 12px 14px; }
  .hero h1 { font-size: 1.4rem; }
  .lock-title { font-size: 1.5rem; }
  .lock-form input { width: 200px; }
  .match-team { font-size: 0.78rem; }
  .match-info .time { font-size: 0.8rem; }
  .nav-tab { padding: 10px 6px; font-size: 0.7rem; }
  .nav-tab .tab-icon { font-size: 1rem; }
  .pred-btn { font-size: 0.7rem; padding: 7px 2px; }
  .submit-btn { padding: 14px 36px; font-size: 1rem; }
  .participants-count { font-size: 2rem; }
  .result-row { flex-direction: column; align-items: flex-start; gap: 6px; }
}
</style>
</head>
<body>

<!-- ===== PASSWORD SCREEN ===== -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">&#9917;</div>
  <div class="lock-title">Quiniela Mundial 2026</div>
  <div class="lock-subtitle">Ingresa la contrasena para participar</div>
  <div class="lock-form">
    <input type="password" id="passwordInput" placeholder="Contrasena" onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()">Entrar</button>
  </div>
  <div class="lock-error" id="lockError">Contrasena incorrecta</div>
  <div class="lock-info">
    <div class="price">$1,000 MXN</div>
    <div class="price-label">Cuota de participacion</div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="app">
  <div class="hero">
    <h1>Quiniela Mundial 2026</h1>
    <p class="subtitle">Fase de Grupos - 48 partidos</p>
    <p class="deadline">Cierre de registro: 9 de junio 2026 a las 23:59</p>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="quiniela">
      <span class="tab-icon">&#9917;</span>Mi Quiniela
    </button>
    <button class="nav-tab" data-tab="participantes">
      <span class="tab-icon">&#128101;</span>Participantes
    </button>
    <button class="nav-tab" data-tab="admin">
      <span class="tab-icon">&#128274;</span>Admin
    </button>
  </div>

  <div class="main">

    <!-- TAB: MI QUINIELA -->
    <div class="tab-content active" id="tab-quiniela">
      <div id="quinielaContent"></div>
    </div>

    <!-- TAB: PARTICIPANTES -->
    <div class="tab-content" id="tab-participantes">
      <div id="participantesContent">
        <p style="text-align:center;color:var(--text-dim);padding:40px;">Cargando participantes...</p>
      </div>
    </div>

    <!-- TAB: ADMIN -->
    <div class="tab-content" id="tab-admin">
      <div class="admin-login" id="adminLogin">
        <h3 style="margin-bottom:14px;color:var(--accent2);">Panel de Administrador</h3>
        <input type="password" id="adminPassInput" placeholder="Contrasena admin" onkeydown="if(event.key==='Enter')checkAdmin()">
        <br>
        <button onclick="checkAdmin()">Entrar</button>
      </div>
      <div class="admin-panel" id="adminPanel"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
var CONFIG = {
  password: 'mundial2026',
  adminPassword: 'admin2026',
  closeDate: new Date(2026, 5, 9, 23, 59, 59),
  APPS_SCRIPT_URL: ''
};

// ===== MATCH DATA (from mundial2026.html - group stage only) =====
var flagCodes = {
  'Mexico':'mx','Sudafrica':'za','Corea del Sur':'kr','Republica Checa':'cz',
  'Canada':'ca','Bosnia Herzegovina':'ba','Estados Unidos':'us','Paraguay':'py',
  'Qatar':'qa','Suiza':'ch','Brasil':'br','Marruecos':'ma','Haiti':'ht',
  'Escocia':'gb-sct','Australia':'au','Turquia':'tr','Alemania':'de',
  'Curazao':'cw','Paises Bajos':'nl','Japon':'jp','Costa de Marfil':'ci',

function formatDateShort(dateStr) {
  var parts = dateStr.split('-');
  var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  var days = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
  var months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function setPred(matchId, value, btn) {
  predictions[matchId] = value;

  var row = document.getElementById('match-' + matchId);
  var btns = row.querySelectorAll('.pred-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = 'pred-btn';
  }

  if (value === 'home') btn.classList.add('selected-home');
  else if (value === 'draw') btn.classList.add('selected-draw');
  else btn.classList.add('selected-away');

  row.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  var count = Object.keys(predictions).length;
  var total = matches.length;
  document.getElementById('predCount').textContent = count;
  document.getElementById('progressFill').style.width = (count / total * 100) + '%';
}

function submitQuiniela() {
  var name = document.getElementById('playerName').value.trim();
  if (!name) { showToast('Ingresa tu nombre'); return; }
  if (name.length < 3) { showToast('El nombre debe tener al menos 3 caracteres'); return; }

  var count = Object.keys(predictions).length;
  if (count < matches.length) {
    showToast('Faltan ' + (matches.length - count) + ' partidos por completar');
    return;
  }

  if (hasSubmitted(name)) {
    showToast('Ya existe una quiniela con ese nombre');
    return;
  }

  if (isClosed()) {
    showToast('El registro ya esta cerrado');
    return;
  }

  var entry = {
    name: name,
    timestamp: new Date().toISOString(),
    predictions: JSON.parse(JSON.stringify(predictions))
  };

  allParticipants.push(entry);
  try { localStorage.setItem('quiniela_participants', JSON.stringify(allParticipants)); } catch(e) {}

  // Try to send to Google Sheets
  if (CONFIG.APPS_SCRIPT_URL) {
    sendToSheet(entry);
  }

  var status = document.getElementById('submitStatus');
  status.className = 'status-msg success';
  status.innerHTML = '<strong>Quiniela enviada correctamente!</strong><br>Tu quiniela ha sido registrada. Buena suerte!';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Quiniela Enviada';
  showToast('Quiniela registrada!');
}

function sendToSheet(entry) {
  var row = [entry.timestamp, entry.name];
  for (var i = 0; i < matches.length; i++) {
    var p = entry.predictions[matches[i].id] || '';
    row.push(p);
  }

  try {
    fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action:'submit', data: row})
    });
  } catch(e) {}
}

// ===== RENDER PARTICIPANTS =====
function renderParticipants() {
  var container = document.getElementById('participantesContent');

  if (allParticipants.length === 0) {
    container.innerHTML =
      '<div class="participants-header">' +
        '<div class="participants-count">0</div>' +
        '<div class="participants-label">Participantes registrados</div>' +
      '</div>' +
      '<p style="text-align:center;color:var(--text-dim);padding:30px;">Aun no hay participantes registrados.</p>';
    return;
  }

  var html =
    '<div class="participants-header">' +
      '<div class="participants-count">' + allParticipants.length + '</div>' +
      '<div class="participants-label">Participantes registrados</div>' +
    '</div>';

  // Leaderboard if there are results
  var hasResults = Object.keys(realResults).length > 0;
  if (hasResults) {
    var scores = allParticipants.map(function(p) {
      var pts = 0;
      for (var mid in realResults) {
        if (p.predictions[mid] === realResults[mid]) pts++;
      }
      return {name: p.name, points: pts};
    }).sort(function(a,b) { return b.points - a.points; });

    html += '<div class="leaderboard">';
    html += '<h3 style="color:var(--accent2);margin-bottom:12px;">Tabla de Posiciones</h3>';
    for (var si = 0; si < scores.length; si++) {
      var posClass = si === 0 ? 'gold' : si === 1 ? 'silver' : si === 2 ? 'bronze' : '';
      html +=
        '<div class="leaderboard-row">' +
          '<div class="leaderboard-pos ' + posClass + '">' + (si+1) + '</div>' +
          '<div class="leaderboard-name">' + scores[si].name + '</div>' +
          '<div class="leaderboard-pts">' + scores[si].points + ' pts</div>' +
        '</div>';
    }
    html += '</div><br>';
  }

  // Participant cards
  for (var pi = 0; pi < allParticipants.length; pi++) {
    var p = allParticipants[pi];
    var pts = 0;
    if (hasResults) {
      for (var mid in realResults) {
        if (p.predictions[mid] === realResults[mid]) pts++;
      }
    }

    var dateStr = '';
    try {
      var d = new Date(p.timestamp);
      dateStr = d.toLocaleDateString('es-MX', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    } catch(e) { dateStr = p.timestamp; }

    html +=
      '<div class="participant-card">' +
        '<div class="participant-header" onclick="togglePreds(' + pi + ')">' +
          '<div>' +
            '<div class="participant-name">' + p.name + '</div>' +
            '<div class="participant-date">Registro: ' + dateStr + '</div>' +
          '</div>' +
          (hasResults ? '<div class="participant-points">' + pts + ' pts</div>' : '') +
          '<span class="participant-toggle" id="toggle-' + pi + '">&#9660;</span>' +
        '</div>' +
        '<div class="participant-preds" id="preds-' + pi + '">';

    for (var mi = 0; mi < matches.length; mi++) {
      var m = matches[mi];
      var pred = p.predictions[m.id] || '-';
      var predLabel = pred === 'home' ? m.home : pred === 'away' ? m.away : pred === 'draw' ? 'Empate' : '-';
      var predClass = pred === 'home' ? 'home' : pred === 'away' ? 'away' : 'draw';

      if (hasResults && realResults[m.id]) {
        predClass = pred === realResults[m.id] ? 'correct' : 'wrong';
      }

      html +=
        '<div class="pred-row">' +
          '<span class="pred-match">' + m.home + ' vs ' + m.away + '</span>' +
          '<span class="pred-value ' + predClass + '">' + predLabel + '</span>' +
        '</div>';
    }

    html += '</div></div>';
  }

  container.innerHTML = html;
}

function togglePreds(idx) {
  var el = document.getElementById('preds-' + idx);
  var tog = document.getElementById('toggle-' + idx);
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    tog.innerHTML = '&#9660;';
  } else {
    el.classList.add('open');
    tog.innerHTML = '&#9650;';
  }
}

      '<h3>Importar Participantes</h3>' +
      '<p style="color:var(--text-dim);font-size:0.8rem;margin-bottom:10px;">Pega aqui datos JSON de participantes para importar</p>' +
      '<textarea id="importData" style="width:100%;height:100px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:0.8rem;resize:vertical;" placeholder="Pega el JSON aqui..."></textarea>' +
      '<button class="admin-btn btn-save" style="margin-top:10px;" onclick="importParticipants()">Importar</button>' +
    '</div>';

  container.innerHTML = html;
}

function setResult(matchId, value, btn) {
  if (realResults[matchId] === value) {
    delete realResults[matchId];
    btn.className = 'result-btn';
  } else {
    realResults[matchId] = value;
    var row = btn.parentNode;
    var btns = row.querySelectorAll('.result-btn');
    for (var i = 0; i < btns.length; i++) btns[i].className = 'result-btn';
    if (value === 'home') btn.classList.add('active-home');
    else if (value === 'draw') btn.classList.add('active-draw');
    else btn.classList.add('active-away');
  }
}

function saveResults() {
  try {
    localStorage.setItem('quiniela_results', JSON.stringify(realResults));
    showToast('Resultados guardados (' + Object.keys(realResults).length + ' partidos)');
    renderParticipants();
  } catch(e) {
    showToast('Error al guardar');
  }
}

function exportData() {
  var data = {
    participants: allParticipants,
    results: realResults,
    exportDate: new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'quiniela_mundial_2026_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Datos exportados');
}

function importParticipants() {
  var text = document.getElementById('importData').value.trim();
  if (!text) { showToast('Pega datos JSON primero'); return; }
  try {
    var data = JSON.parse(text);
    if (data.participants) {
      allParticipants = data.participants;
      if (data.results) realResults = data.results;
    } else if (Array.isArray(data)) {
      allParticipants = data;
    }
    localStorage.setItem('quiniela_participants', JSON.stringify(allParticipants));
    localStorage.setItem('quiniela_results', JSON.stringify(realResults));
    showToast('Importados ' + allParticipants.length + ' participantes');
    renderParticipants();
    renderAdmin();
  } catch(e) {
    showToast('Error: JSON invalido');
  }
}

// ===== PDF GENERATION =====
function generatePDF() {
  var w = window.open('', '_blank');
  var hasResults = Object.keys(realResults).length > 0;

  var scores = [];
  if (hasResults) {
    scores = allParticipants.map(function(p) {
      var pts = 0;
      for (var mid in realResults) {
        if (p.predictions[mid] === realResults[mid]) pts++;
      }
      return {name: p.name, points: pts};
    }).sort(function(a,b) { return b.points - a.points; });
  }

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Quiniela Mundial 2026 - PDF</title>';
  html += '<style>';
  html += 'body{font-family:Arial,sans-serif;font-size:11px;color:#333;margin:20px;}';
  html += 'h1{font-size:20px;text-align:center;margin-bottom:5px;}';
  html += 'h2{font-size:14px;margin:15px 0 8px;color:#333;border-bottom:2px solid #333;padding-bottom:4px;}';
  html += 'h3{font-size:12px;margin:10px 0 5px;color:#555;}';
  html += '.subtitle{text-align:center;color:#666;margin-bottom:15px;font-size:12px;}';
  html += 'table{width:100%;border-collapse:collapse;margin-bottom:15px;font-size:10px;}';
  html += 'th,td{border:1px solid #ccc;padding:4px 6px;text-align:left;}';
  html += 'th{background:#f0f0f0;font-weight:bold;}';
  html += '.correct{background:#d4edda;color:#155724;}';
  html += '.wrong{background:#f8d7da;color:#721c24;}';
  html += '.score-table td:last-child{text-align:center;font-weight:bold;}';
  html += '@media print{body{margin:10px;font-size:9px;}h1{font-size:16px;}table{font-size:8px;}}';
  html += '</style></head><body>';
  html += '<h1>Quiniela Mundial 2026</h1>';
  html += '<p class="subtitle">Fase de Grupos - Generado el ' + new Date().toLocaleString('es-MX') + '</p>';
  html += '<p class="subtitle">' + allParticipants.length + ' participantes registrados | Cuota: $1,000 MXN</p>';

  if (hasResults && scores.length > 0) {
    html += '<h2>Tabla de Posiciones</h2>';
    html += '<table class="score-table"><tr><th>#</th><th>Nombre</th><th>Puntos</th></tr>';
    for (var si = 0; si < scores.length; si++) {
      html += '<tr><td>' + (si+1) + '</td><td>' + scores[si].name + '</td><td>' + scores[si].points + '</td></tr>';
    }
    html += '</table>';
  }

  for (var pi = 0; pi < allParticipants.length; pi++) {
    var p = allParticipants[pi];
    var dateStr = '';
    try { dateStr = new Date(p.timestamp).toLocaleString('es-MX'); } catch(e) { dateStr = p.timestamp; }

    html += '<h2>' + p.name + '</h2>';
    html += '<p style="color:#666;font-size:10px;">Registro: ' + dateStr + '</p>';
    html += '<table><tr><th>Partido</th><th>Prediccion</th>';
    if (hasResults) html += '<th>Resultado</th>';
    html += '</tr>';

    for (var mi = 0; mi < matches.length; mi++) {
      var m = matches[mi];
      var pred = p.predictions[m.id] || '-';
      var predLabel = pred === 'home' ? m.home : pred === 'away' ? m.away : pred === 'draw' ? 'Empate' : '-';
      var cls = '';

      if (hasResults && realResults[m.id]) {
        cls = pred === realResults[m.id] ? ' class="correct"' : ' class="wrong"';
      }

      var resLabel = '';
      if (hasResults && realResults[m.id]) {
        var r = realResults[m.id];
        resLabel = r === 'home' ? m.home : r === 'away' ? m.away : 'Empate';
      }

      html += '<tr' + cls + '><td>' + m.home + ' vs ' + m.away + '</td><td>' + predLabel + '</td>';
      if (hasResults) html += '<td>' + resLabel + '</td>';
      html += '</tr>';
    }
    html += '</table>';

    if (pi < allParticipants.length - 1) html += '<div style="page-break-after:always;"></div>';
  }

  html += '<script>window.onload=function(){window.print();}<\/script>';
  html += '</body></html>';
  w.document.write(html);
  w.document.close();
}

// ===== INIT =====
if (document.getElementById('app').classList.contains('active')) {
  renderQuiniela();
  renderParticipants();
}
</script>
