name: Actualizar resultados

on:
  schedule:
    - cron: '7,37 * * * *'   # cada 30 min (minutos 7 y 37, hora UTC)
  workflow_dispatch:          # boton para correrlo manualmente

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cargar resultados terminados a Supabase
        run: node scripts/update-results.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
